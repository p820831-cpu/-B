name: Run Rate Test

on:
  workflow_dispatch: # 這行可以讓你手動點擊按鈕來執行程式

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 複製專案程式碼
      uses: actions/checkout@v4
      
    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 執行匯率測試
      run: python main.py
