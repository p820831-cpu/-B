name: Run Rate Test

on:
  workflow_dispatch: # 保留手動測試按鈕
  schedule:
    # 每天台灣時間早上 9:05 自動檢查 (UTC 01:05)
    - cron: '5 1 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 複製專案程式碼
      uses: actions/checkout@v4
      
    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 安裝 Yahoo 金融套件
      run: pip install yfinance
        
    - name: 執行匯率測試
      # env 區塊非常重要，它負責把 GitHub 保險箱的密鑰交給 Python 程式使用
      env:
        LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
      run: python main.py
