name: Run Rate Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 複製專案程式碼
      uses: actions/checkout@v4
      
    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 安裝 Yahoo 金融套件
      run: pip install yfinance
        
    - name: 執行匯率測試
      run: python main.py
