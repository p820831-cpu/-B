name: Run Rate Test

on:
  workflow_dispatch:
  schedule:
    - cron: '5 1 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 複製專案程式碼
      uses: actions/checkout@v4
      
    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 安裝必要金融與網路套件
      run: |
        pip install yfinance
        pip install requests
        
    - name: 執行匯率測試
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python main.py
